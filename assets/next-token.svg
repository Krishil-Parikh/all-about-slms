<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="Animated next-token prediction demo">
<title>Next-token prediction: The sun rises in the … → morning</title>
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131030"/><stop offset="1" stop-color="#0b0a1f"/></linearGradient>
  <linearGradient id="barHot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
</defs>
<style>
  .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
  .lbl { font-size: 16px; fill: #9a9dd0; }
  .hot { fill: #ffffff; font-weight: 700; }
  .pctt { font-size: 15px; fill: #c4c6f0; }
  .prompt { font-size: 21px; fill: #e6e7ff; }
  .dim { font-size: 13px; fill: #6d70a6; }
  .bar { transform-box: fill-box; transform-origin: left center; }
  .cursor { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0 } }
  @keyframes b0 { 0%,13.3% {transform:scaleX(0)} 23.3%,90% {transform:scaleX(1)} 97%,100% {transform:scaleX(0)} } .b0 { animation: b0 9.0s cubic-bezier(.2,.8,.2,1) infinite; } @keyframes p0 { 0%,23.3% {opacity:0} 26.7%,90% {opacity:1} 96%,100% {opacity:0} } .p0 { animation: p0 9.0s ease infinite; } @keyframes b1 { 0%,16.1% {transform:scaleX(0)} 26.1%,90% {transform:scaleX(1)} 97%,100% {transform:scaleX(0)} } .b1 { animation: b1 9.0s cubic-bezier(.2,.8,.2,1) infinite; } @keyframes p1 { 0%,26.1% {opacity:0} 29.4%,90% {opacity:1} 96%,100% {opacity:0} } .p1 { animation: p1 9.0s ease infinite; } @keyframes b2 { 0%,18.9% {transform:scaleX(0)} 28.9%,90% {transform:scaleX(1)} 97%,100% {transform:scaleX(0)} } .b2 { animation: b2 9.0s cubic-bezier(.2,.8,.2,1) infinite; } @keyframes p2 { 0%,28.9% {opacity:0} 32.2%,90% {opacity:1} 96%,100% {opacity:0} } .p2 { animation: p2 9.0s ease infinite; } @keyframes b3 { 0%,21.7% {transform:scaleX(0)} 31.7%,90% {transform:scaleX(1)} 97%,100% {transform:scaleX(0)} } .b3 { animation: b3 9.0s cubic-bezier(.2,.8,.2,1) infinite; } @keyframes p3 { 0%,31.7% {opacity:0} 35.0%,90% {opacity:1} 96%,100% {opacity:0} } .p3 { animation: p3 9.0s ease infinite; } @keyframes b4 { 0%,24.4% {transform:scaleX(0)} 34.4%,90% {transform:scaleX(1)} 97%,100% {transform:scaleX(0)} } .b4 { animation: b4 9.0s cubic-bezier(.2,.8,.2,1) infinite; } @keyframes p4 { 0%,34.4% {opacity:0} 37.8%,90% {opacity:1} 96%,100% {opacity:0} } .p4 { animation: p4 9.0s ease infinite; } @keyframes hl { 0%,43.3% {opacity:0} 46.7%,90% {opacity:1} 96%,100% {opacity:0} } .hl { animation: hl 9.0s ease infinite; } @keyframes ap { 0%,51.1% {opacity:0; transform:translateX(-12px)} 55.6%,90% {opacity:1; transform:translateX(0)} 96%,100% {opacity:0} } .appended { animation: ap 9.0s ease-out infinite; } @keyframes cur { 0%,51.1% {transform:translateX(0)} 55.6%,90% {transform:translateX(96px)} 96%,100% {transform:translateX(0)} } .curpos { animation: cur 9.0s ease-out infinite; }
  
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .chip, .bar, .pct, .appended, .tag { opacity: 1 !important; transform: none !important; }
  }
</style>
<rect width="1000" height="400" rx="18" fill="url(#card)"/>
<rect x=".75" y=".75" width="998.5" height="398.5" rx="17.5" fill="none" stroke="#8b5cf6" stroke-opacity=".28"/>
<circle cx="30" cy="28" r="6" fill="#f87171"/><circle cx="50" cy="28" r="6" fill="#fbbf24"/><circle cx="70" cy="28" r="6" fill="#34d399"/>
<text x="500.0" y="33" class="mono dim" text-anchor="middle">next_token_prediction.py</text>
<line x1="0" y1="52" x2="1000" y2="52" stroke="#ffffff" stroke-opacity=".06"/>

<text x="40" y="102" class="mono prompt"><tspan fill="#a78bfa">&gt;&gt;&gt;</tspan> The sun rises in the</text>
<g class="appended"><text x="356" y="102" class="mono prompt" font-weight="700" fill="#22d3ee">morning</text></g>
<g class="curpos"><rect x="356" y="84" width="11" height="23" fill="#a78bfa" class="cursor"/></g>

<g class="hl"><rect x="40" y="144" width="920" height="38" rx="9" fill="#8b5cf6" fill-opacity=".10" stroke="#8b5cf6" stroke-opacity=".5"/>
<text x="942" y="169" class="mono" font-size="13" fill="#a78bfa" text-anchor="end">✓ sampled</text></g>
<text x="190" y="169" class="mono lbl hot" text-anchor="end">morning</text><rect x="210" y="150" width="600" height="26" rx="7" fill="#ffffff" fill-opacity=".04"/><rect x="210" y="150" width="432" height="26" rx="7" fill="url(#barHot)" class="bar b0"/><text x="654" y="169" class="mono pctt pct p0">72%</text><text x="190" y="211" class="mono lbl" text-anchor="end">east</text><rect x="210" y="192" width="600" height="26" rx="7" fill="#ffffff" fill-opacity=".04"/><rect x="210" y="192" width="72" height="26" rx="7" fill="#3f3a7a" class="bar b1"/><text x="294" y="211" class="mono pctt pct p1">12%</text><text x="190" y="253" class="mono lbl" text-anchor="end">sky</text><rect x="210" y="234" width="600" height="26" rx="7" fill="#ffffff" fill-opacity=".04"/><rect x="210" y="234" width="48" height="26" rx="7" fill="#3f3a7a" class="bar b2"/><text x="270" y="253" class="mono pctt pct p2">8%</text><text x="190" y="295" class="mono lbl" text-anchor="end">evening</text><rect x="210" y="276" width="600" height="26" rx="7" fill="#ffffff" fill-opacity=".04"/><rect x="210" y="276" width="30" height="26" rx="7" fill="#3f3a7a" class="bar b3"/><text x="252" y="295" class="mono pctt pct p3">5%</text><text x="190" y="337" class="mono lbl" text-anchor="end">other</text><rect x="210" y="318" width="600" height="26" rx="7" fill="#ffffff" fill-opacity=".04"/><rect x="210" y="318" width="18" height="26" rx="7" fill="#3f3a7a" class="bar b4"/><text x="240" y="337" class="mono pctt pct p4">3%</text>

<text x="40" y="378" class="mono dim">P(xₜ | x₁ … xₜ₋₁)  ·  illustrative probabilities, not real model output</text>
</svg>