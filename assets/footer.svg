<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Understand, Build, Train, Optimize, Deploy">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#120c2e"/><stop offset="1" stop-color="#0a1430"/></linearGradient>
  <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="160" y1="0" x2="1040" y2="0"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
</defs>
<style>
  .t { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 18px; fill: #c7c9f5; letter-spacing: 1px; }
  .s { font-family: Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 14px; fill: #7d81b8; }
  .dot { animation: hop 5s ease-in-out infinite; }
  @keyframes hop { 0% { transform: translateX(0) } 100% { transform: translateX(880px) } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
</style>
<rect width="1200" height="120" rx="18" fill="url(#bg)"/>
<line x1="160" y1="44" x2="1040" y2="44" stroke="url(#accent)" stroke-opacity=".5" stroke-width="2"/>
<circle cx="160" cy="44" r="4" fill="#a78bfa"/><text x="160" y="78" class="t" text-anchor="middle">Understand</text><circle cx="380" cy="44" r="4" fill="#a78bfa"/><text x="380" y="78" class="t" text-anchor="middle">Build</text><circle cx="600" cy="44" r="4" fill="#a78bfa"/><text x="600" y="78" class="t" text-anchor="middle">Train</text><circle cx="820" cy="44" r="4" fill="#a78bfa"/><text x="820" y="78" class="t" text-anchor="middle">Optimize</text><circle cx="1040" cy="44" r="4" fill="#a78bfa"/><text x="1040" y="78" class="t" text-anchor="middle">Deploy</text>
<circle cx="160" cy="44" r="6" fill="#22d3ee" class="dot"/>
<text x="600.0" y="106" class="s" text-anchor="middle">one concept · one notebook · one experiment at a time</text>
</svg>